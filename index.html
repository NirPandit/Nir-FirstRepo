<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    
    <!-- 1. Bootstrap 5 CSS (Correct and Full Live Link) -->
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- 2. FontAwesome for Icons (Correct and Full Live Link) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* खुद का छोटा सा स्टाइल ताकि साइडबार पूरे पेज पर दिखे */
        .sidebar-container {
            min-height: 100vh;
            width: 250px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="bg-dark text-white p-3 sidebar-container">
            <h4 class="text-center my-3">.NET Admin</h4>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link text-white"><i class="fa-solid fa-gauge me-2"></i> Dashboard</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link active"><i class="fa-solid fa-users me-2"></i> Users</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link text-white"><i class="fa-solid fa-gear me-2"></i> Settings</a>
                </li>
            </ul>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">User Management</h2>
                <button class="btn btn-primary"><i class="fa-solid fa-user-plus me-2"></i>Add New User</button>
            </div>

            <!-- Search and Filter Bar -->
            <div class="card p-3 mb-4 shadow-sm border-0">
                <div class="row">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" placeholder="Search users...">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Responsive Data Table -->
            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-3">Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th class="text-end pe-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Demo Row 1 -->
                            <tr>
                                <td class="ps-3 fw-semibold">Rahul Sharma</td>
                                <td>rahul@example.com</td>
                                <td><span class="badge bg-success px-2 py-1">Admin</span></td>
                                <td class="text-end pe-3">
                                    <button class="btn btn-sm btn-outline-secondary me-1" title="Edit"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn btn-sm btn-outline-danger" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <!-- Demo Row 2 -->
                            <tr>
                                <td class="ps-3 fw-semibold">Amit Kumar</td>
                                <td>amit@example.com</td>
                                <td><span class="badge bg-primary px-2 py-1">Developer</span></td>
                                <td class="text-end pe-3">
                                    <button class="btn btn-sm btn-outline-secondary me-1" title="Edit"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn btn-sm btn-outline-danger" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Bootstrap 5 JavaScript (Correct and Full Live Link) -->
    <script src="https://jsdelivr.net" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="crossorigin"></script>
</body>
</html>
