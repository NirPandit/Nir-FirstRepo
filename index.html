<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-light">

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
            <h4>.NET Admin</h4>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="#" class="nav-link text-white"><i class="fa-solid fa-gauge me-2"></i> Dashboard</a></li>
                <li><a href="#" class="nav-link active"><i class="fa-solid fa-users me-2"></i> Users</a></li>
                <li><a href="#" class="nav-link text-white"><i class="fa-solid fa-gear me-2"></i> Settings</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="w-100 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>User Management</h2>
                <button class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Add New User</button>
            </div>

            <!-- Filters -->
            <div class="card p-3 mb-4 shadow-sm">
                <div class="row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Search users...">
                    </div>
                </div>
            </div>

            <!-- Data Table -->
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Prototype Row 1 -->
                            <tr>
                                <td>Rahul Sharma</td>
                                <td>rahul@example.com</td>
                                <td><span class="badge bg-success">Admin</span></td>
                                {* .NET में यहाँ आप @item.Name वगैरह बाइंड करेंगे *}
                                <td>
                                    <button class="btn btn-sm btn-outline-secondary me-1"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
