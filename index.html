<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <!-- Linking External CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <h4>.NET Admin</h4>
            <hr>
            <ul>
                <li><a href="#">📊 Dashboard</a></li>
                <li><a href="#" class="active">👥 Users</a></li>
                <li><a href="#">⚙️ Settings</a></li>
            </ul>
        </div>

        <!-- Main Workspace Area -->
        <div class="main-content">
            <div class="header-area">
                <h2>User Management</h2>
                <button class="btn-primary" id="openModalBtn">➕ Add New User</button>
            </div>

            <!-- Search Bar Layout Component -->
            <div class="card">
                <input type="text" class="form-control-search" placeholder="Search users...">
            </div>

            <!-- Data Table Dashboard Component -->
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Default Existing Data Row for Prototype Testing -->
                        <tr>
                            <td style="font-weight: 600;">Rahul Sharma</td>
                            <td>rahul@example.com</td>
                            <td><span class="badge bg-success">Admin</span></td>
                            <td><button class="btn-action" onclick="deleteRow(this)">🗑️ Delete</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- NEW USER POPUP REGISTRATION WINDOW (MODAL) -->
    <div class="modal-overlay" id="userModal">
        <div class="modal-window">
            <div class="modal-header">
                <span>Create New User Profile</span>
                <span class="close-btn" id="closeModalBtn">&times;</span>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <label>Full Name</label>
                    <input type="text" id="userName" class="form-control" placeholder="e.g. John Doe" required>
                    
                    <label>Email Address</label>
                    <input type="email" id="userEmail" class="form-control" placeholder="e.g. john@example.com" required>
                    
                    <label>Assign Application Role</label>
                    <select id="userRole" class="form-control">
                        <option value="Admin">Admin</option>
                        <option value="Developer">Developer</option>
                        <option value="User">User</option>
                    </select>

                    <div class="modal-footer">
                        <button type="button" class="btn-close-modal" id="cancelModalBtn">Cancel</button>
                        <button type="submit" class="btn-primary">Save User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Linking External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
